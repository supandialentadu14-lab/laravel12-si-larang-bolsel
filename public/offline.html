<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Offline | SI-LARANG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #F9FAFB; }
        @media (prefers-color-scheme: dark) {
            body { background-color: #0F172A; color: #F8FAFC; }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6 text-center">
    <div class="max-w-sm">
        <div class="w-20 h-20 bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 rounded-3xl flex items-center justify-center mx-auto mb-8 text-3xl">
            <i class="fas fa-wifi-slash"></i>
        </div>
        <h1 class="text-2xl font-black uppercase tracking-widest mb-4">Koneksi Terputus</h1>
        <p class="text-gray-500 dark:text-gray-400 text-sm font-bold leading-relaxed mb-8 uppercase tracking-tight">
            Ops! Sepertinya Anda sedang offline. SI-LARANG memerlukan koneksi internet untuk sinkronisasi data stok terbaru.
        </p>
        <button onclick="window.location.reload()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase tracking-widest shadow-xl shadow-indigo-100 dark:shadow-none active:scale-95 transition-all">
            Coba Lagi
        </button>
        <p class="mt-8 text-[10px] text-gray-400 uppercase font-bold tracking-[0.2em]">&copy; 2026 SI-LARANG</p>
    </div>
</body>
</html>
